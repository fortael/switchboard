name: Test

on:
  push:
    branches: [main]
  pull_request:
    # This filter matches the PR's target branch, not its source. DEV-windows is
    # listed so that PRs merging into the Windows integration branch are tested
    # too, instead of only being checked once it is merged into main.
    branches: [main, DEV-windows]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite finishes in seconds; anything past this is a stuck process, not
    # slow tests. Without a cap a leaked handle in a test file burned six hours
    # of runner time before the job was cancelled by hand.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
